[umber]
label = "Umber"
bg = "#16120e"
fg = "#e3d6b8"
dim = "#8d7d65"
border = "#3a3126"
active = "#d49a3a"
bar = "#0d0b08"
barfg = "#cfc1a3"
bar_warn = "#dd7357"
sigil = "#d49a3a"
ansi = [
  "#16120e", "#d25f42", "#8f9a5a", "#d49a3a", "#7f93a8", "#a8707a", "#7aa08c", "#cfc1a3",
  "#8d7d65", "#dd7357", "#b0b878", "#e8bd6a", "#a3b3c2", "#c9939a", "#9fc0ab", "#f3ead3",
]
wall_desk = ["#16120e", "#5c4c39"]
wall_lock = ["#16120e", "#c9b994"]

